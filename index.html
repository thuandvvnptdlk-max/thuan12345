<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cấu hình LuxPower Scheduler</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .card {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 420px;
    }
    h2 {
      margin-top: 0;
      text-align: center;
      color: #1a73e8;
      font-size: 20px;
    }
    label {
      font-weight: 600;
      font-size: 13px;
      color: #444;
      display: block;
      margin-top: 14px;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 16px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-save { background: #1a73e8; color: #fff; }
    .btn-group { display: flex; gap: 10px; margin-top: 10px; }
    .btn-on { background: #28a745; color: #fff; margin-top: 0; }
    .btn-off { background: #dc3545; color: #fff; margin-top: 0; }
    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      background: #f8f9fa;
      border: 1px solid #e2e8f0;
      font-size: 13px;
      color: #333;
      word-break: break-word;
      min-height: 20px;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>⚡ Hẹn Giờ LuxPower</h2>

  <label>GitHub Personal Access Token (PAT):</label>
  <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx">

  <label>Tên chủ Repo (Owner):</label>
  <input type="text" id="repoOwner" value="thuandvvnptdlk-max">

  <label>Tên Repository:</label>
  <input type="text" id="repoName" value="thuan12345">

  <div style="display: flex; gap: 10px;">
    <div style="flex: 1;">
      <label>Giờ TẮT (Disable):</label>
      <input type="time" id="offTime" value="08:00">
    </div>
    <div style="flex: 1;">
      <label>Giờ BẬT (Enable):</label>
      <input type="time" id="onTime" value="11:24">
    </div>
  </div>

  <button class="btn btn-save" id="btnUpdateSchedule">💾 Cập nhật giờ tự động</button>

  <label style="margin-top: 20px;">Điều khiển khẩn cấp:</label>
  <div class="btn-group">
    <button class="btn btn-on" id="btnForceOn">⚡ BẬT NGAY</button>
    <button class="btn btn-off" id="btnForceOff">🔌 TẮT NGAY</button>
  </div>

  <div class="status" id="statusBox">Sẵn sàng</div>
</div>

<script>
  const statusBox = document.getElementById('statusBox');

  // Khôi phục cấu hình đã lưu trong trình duyệt
  document.getElementById('ghToken').value = localStorage.getItem('lux_gh_token') || '';
  document.getElementById('repoOwner').value = localStorage.getItem('lux_gh_owner') || 'thuandvvnptdlk-max';
  document.getElementById('repoName').value = localStorage.getItem('lux_gh_repo') || 'thuan12345';
  document.getElementById('offTime').value = localStorage.getItem('lux_off_time') || '08:00';
  document.getElementById('onTime').value = localStorage.getItem('lux_on_time') || '11:24';

  function saveLocal() {
    localStorage.setItem('lux_gh_token', document.getElementById('ghToken').value.trim());
    localStorage.setItem('lux_gh_owner', document.getElementById('repoOwner').value.trim());
    localStorage.setItem('lux_gh_repo', document.getElementById('repoName').value.trim());
    localStorage.setItem('lux_off_time', document.getElementById('offTime').value);
    localStorage.setItem('lux_on_time', document.getElementById('onTime').value);
  }

  // Chuyển đổi giờ VN sang Cron UTC
  function toCron(vnTime) {
    const [h, m] = vnTime.split(':').map(Number);
    let utcH = h - 7;
    if (utcH < 0) utcH += 24;
    return `${m} ${utcH} * * *`;
  }

  // Cập nhật file workflow trên GitHub
  document.getElementById('btnUpdateSchedule').addEventListener('click', async () => {
    saveLocal();
    const token = document.getElementById('ghToken').value.trim();
    const owner = document.getElementById('repoOwner').value.trim();
    const repo = document.getElementById('repoName').value.trim();
    const offTime = document.getElementById('offTime').value;
    const onTime = document.getElementById('onTime').value;

    if (!token) {
      statusBox.textContent = '❌ Lỗi: Vui lòng nhập GitHub Token!';
      return;
    }

    statusBox.textContent = '⏳ Đang đọc cấu hình hiện tại trên GitHub...';

    try {
      const filePath = '.github/workflows/luxpower-schedule.yml';
      const fileUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`;

      const getRes = await fetch(fileUrl, {
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github.v3+json'
        }
      });

      if (!getRes.ok) throw new Error('Không tìm thấy file workflow hoặc sai Token/Repo');
      const fileData = await getRes.json();
      const sha = fileData.sha;

      const offCron = toCron(offTime);
      const onCron = toCron(onTime);

      const [offH] = offTime.split(':').map(Number);
      let offUtcH = offH - 7;
      if (offUtcH < 0) offUtcH += 24;

      const newYaml = `name: LuxPower Auto Schedule

on:
  schedule:
    # ${offTime} VN (TAT)
    - cron: '${offCron}'
    # ${onTime} VN (BAT)
    - cron: '${onCron}'
  workflow_dispatch:
    inputs:
      action:
        description: 'Chon hanh dong'
        required: true
        default: 'enable'
        type: choice
        options:
          - enable
          - disable

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install axios axios-cookiejar-support tough-cookie

      - name: Determine Action
        id: determine_action
        run: |
          if [ "\${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ACTION=\${{ github.event.inputs.action }}" >> $GITHUB_ENV
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -eq ${offUtcH} ]; then
              echo "ACTION=disable" >> $GITHUB_ENV
            else
              echo "ACTION=enable" >> $GITHUB_ENV
            fi
          fi

      - name: Run LuxPower Control
        env:
          LUX_ACCOUNT: \${{ secrets.LUX_ACCOUNT }}
          LUX_PASSWORD: \${{ secrets.LUX_PASSWORD }}
          INVERTER_SN: \${{ secrets.INVERTER_SN }}
        run: |
          node luxpower.js $ACTION
`;

      statusBox.textContent = '⏳ Đang lưu giờ hẹn mới lên GitHub...';

      const putRes = await fetch(fileUrl, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: `Update schedule: OFF ${offTime} | ON ${onTime}`,
          content: btoa(unescape(encodeURIComponent(newYaml))),
          sha: sha
        })
      });

      if (!putRes.ok) throw new Error('Không thể ghi đè file workflow.');

      statusBox.textContent = `✅ Thành công! Đã đặt: Tắt lúc ${offTime}, Bật lúc ${onTime}`;
    } catch (err) {
      statusBox.textContent = `❌ Lỗi: ${err.message}`;
    }
  });

  // Điều khiển chạy ngay
  async function triggerWorkflow(action) {
    saveLocal();
    const token = document.getElementById('ghToken').value.trim();
    const owner = document.getElementById('repoOwner').value.trim();
    const repo = document.getElementById('repoName').value.trim();

    if (!token) {
      statusBox.textContent = '❌ Lỗi: Vui lòng nhập GitHub Token!';
      return;
    }

    statusBox.textContent = `⏳ Đang gửi lệnh ${action.toUpperCase()} ngay lập tức...`;

    try {
      const url = `https://api.github.com/repos/${owner}/${repo}/actions/workflows/luxpower-schedule.yml/dispatches`;
      const res = await fetch(url, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          ref: 'main',
          inputs: { action: action }
        })
      });

      if (res.status === 204) {
        statusBox.textContent = `✅ Đã gửi lệnh ${action.toUpperCase()} thành công!`;
      } else {
        throw new Error(`Mã phản hồi HTTP ${res.status}`);
      }
    } catch (err) {
      statusBox.textContent = `❌ Lỗi gửi lệnh: ${err.message}`;
    }
  }

  document.getElementById('btnForceOn').addEventListener('click', () => triggerWorkflow('enable'));
  document.getElementById('btnForceOff').addEventListener('click', () => triggerWorkflow('disable'));
</script>

</body>
</html>
