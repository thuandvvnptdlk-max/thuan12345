async function triggerGitHubAction(actionName) {
  // Thay đúng tên file workflow ở đuôi URL nếu file của bạn tên khác
  const workflowFileName = "luxpower-schedule.yml";
  const url = `https://api.github.com/repos/${GH_REPO}/actions/workflows/${workflowFileName}/dispatches`;
  
  const res = await fetch(url, {
    method: "POST",
    headers: {
      "Authorization": `Bearer ${GH_TOKEN}`,
      "Accept": "application/vnd.github.v3+json",
      "User-Agent": "TelegramBot-Cloudflare",
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      ref: "main",
      inputs: { action: actionName }
    })
  });

  if (res.status !== 204) {
    const errorText = await res.text();
    console.error(`GitHub Error [${res.status}]:`, errorText);
    await sendTelegram(ALLOWED_CHAT_ID, `❌ Lỗi GitHub [${res.status}]: ${errorText}`);
    return false;
  }
  return true;
}
