name: LuxPower Auto Schedule

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '24 4 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Chon hanh dong'
        required: true
        default: 'enable'
        type: choice
        options:
          - enable
          - disable

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determine Action
        id: determine_action
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ACTION=${{ github.event.inputs.action }}" >> $GITHUB_ENV
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -eq 1 ]; then
              echo "ACTION=disable" >> $GITHUB_ENV
            else
              echo "ACTION=enable" >> $GITHUB_ENV
            fi
          fi

      - name: Run LuxPower Control
        env:
          LUX_ACCOUNT: ${{ secrets.LUX_ACCOUNT }}
          LUX_PASSWORD: ${{ secrets.LUX_PASSWORD }}
          INVERTER_SN: ${{ secrets.INVERTER_SN }}
        run: |
          node luxpower.js $ACTION
