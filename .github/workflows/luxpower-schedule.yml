name: LuxPower Schedule & Control

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Chế độ (enable/disable)'
        required: true
        default: 'enable'
schedule:
    # Mốc test lúc 17:14 chiều nay (10:14 UTC)
    - cron: '14 10 * * *'
    # 2 mốc chạy cố định hàng ngày
    - cron: '0 1 * * *'
    - cron: '24 4 * * *'

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install axios

      - name: Run LuxPower Script
        env:
          LUX_USER: ${{ secrets.LUX_USER }}
          LUX_PASSWORD: ${{ secrets.LUX_PASSWORD }}
          LUX_DONGLE: ${{ secrets.LUX_DONGLE }}
          ACTION_INPUT: ${{ github.event.inputs.action }}
          CRON_TRIGGER: ${{ github.event.schedule }}
          TELEGRAM_BOT_TOKEN: "8729735813:AAE98rlGp9Cbito73Cp0TA23u7nzbidWmFI"
          TELEGRAM_CHAT_ID: "1817767495"
        run: node luxpower.js
