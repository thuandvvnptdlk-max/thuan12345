name: LuxPower Auto Schedule

on:
  schedule:
    # 08:00 Viet Nam = 01:00 UTC
    - cron: '0 1 * * *'

    # 11:24 Viet Nam = 04:24 UTC
    - cron: '24 4 * * *'

  workflow_dispatch:
    inputs:
      action:
        description: 'Chon hanh dong'
        required: true
        default: 'enable'
        type: choice
        options:
          - enable
          - disable

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install axios axios-cookiejar-support tough-cookie

      - name: Determine Action
        run: |
          echo "======================================"
          echo "LUXPOWER AUTO SCHEDULE"
          echo "======================================"

          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"

          VN_TIME=$(TZ='Asia/Ho_Chi_Minh' date '+%Y-%m-%d %H:%M:%S')
          echo "Gio Viet Nam: $VN_TIME"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACTION="${{ inputs.action }}"
            echo "CHAY THU CONG"
            echo "ACTION=$ACTION"

          elif [ "${{ github.event.schedule }}" = "0 1 * * *" ]; then
            ACTION="disable"
            echo "CHAY TU DONG"
            echo "08:00 VN -> DISABLE"

          elif [ "${{ github.event.schedule }}" = "24 4 * * *" ]; then
            ACTION="enable"
            echo "CHAY TU DONG"
            echo "11:24 VN -> ENABLE"

          else
            echo "ERROR: Khong xac dinh duoc ACTION"
            exit 1
          fi

          echo "======================================"
          echo "ACTION CUOI: $ACTION"
          echo "======================================"

          echo "ACTION=$ACTION" >> "$GITHUB_ENV"

      - name: Run LuxPower Control
        env:
          LUX_ACCOUNT: ${{ secrets.LUX_ACCOUNT }}
          LUX_PASSWORD: ${{ secrets.LUX_PASSWORD }}
          INVERTER_SN: ${{ secrets.INVERTER_SN }}
        run: |
          echo "======================================"
          echo "RUN LUXPOWER"
          echo "ACTION=$ACTION"
          echo "======================================"

          node luxpower.js "$ACTION"
